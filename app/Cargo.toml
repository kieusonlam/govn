[package]
name = "govn"
description = "Vietnamese keyboard for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
govn-engine = { path = "../engine" }
# Only the settings window (a separate process) uses it; GPL-3.0 licence, compatible with govn.
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
slint-build = "1"
